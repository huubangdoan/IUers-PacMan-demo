# 1. Đường dẫn kết nối database (phải đúng tên pacman_db đã tạo)
spring.datasource.url=jdbc:mysql://localhost:3306/pacman_db?useSSL=false&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 4. Tự động cập nhật cấu trúc bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true